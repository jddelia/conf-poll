<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Confluence</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1>Mock Confluence</h1>
        <span class="header-subtitle">Testing Server for conf-poll</span>
      </div>
      <div class="header-right">
        <span class="status-indicator" id="statusIndicator">
          <span class="status-dot"></span>
          <span class="status-text">Connected</span>
        </span>
      </div>
    </header>

    <!-- Main Content -->
    <div class="main-container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Pages</h2>
          <button class="btn btn-primary btn-sm" id="createPageBtn">+ New Page</button>
        </div>
        <div class="page-list" id="pageList">
          <!-- Pages loaded dynamically -->
        </div>

        <div class="sidebar-section">
          <h3>Users</h3>
          <div class="user-list" id="userList">
            <!-- Users loaded dynamically -->
          </div>
          <button class="btn btn-secondary btn-sm" id="createUserBtn">+ Add User</button>
        </div>
      </aside>

      <!-- Editor Panel -->
      <main class="editor-panel">
        <div class="editor-placeholder" id="editorPlaceholder">
          <div class="placeholder-content">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <p>Select a page to edit or create a new one</p>
          </div>
        </div>

        <div class="editor-content" id="editorContent" style="display: none;">
          <!-- Page Metadata -->
          <div class="editor-header">
            <div class="page-meta">
              <span class="page-id" id="pageId"></span>
              <span class="page-version" id="pageVersion"></span>
              <span class="page-updated" id="pageUpdated"></span>
            </div>
            <div class="editor-actions">
              <button class="btn btn-danger btn-sm" id="deletePageBtn">Delete</button>
            </div>
          </div>

          <!-- Title Input -->
          <div class="form-group">
            <label for="pageTitle">Page Title</label>
            <input type="text" id="pageTitle" class="form-control" placeholder="Enter page title">
          </div>

          <!-- Editor Mode Toggle -->
          <div class="editor-mode-toggle">
            <button class="mode-btn active" data-mode="table" id="tableModeBtn">Table Editor</button>
            <button class="mode-btn" data-mode="html" id="htmlModeBtn">Raw HTML</button>
          </div>

          <!-- Table Editor -->
          <div class="table-editor" id="tableEditor">
            <div class="table-toolbar">
              <button class="btn btn-sm" id="addRowBtn">+ Row</button>
              <button class="btn btn-sm" id="addColBtn">+ Column</button>
              <button class="btn btn-sm" id="removeRowBtn">- Row</button>
              <button class="btn btn-sm" id="removeColBtn">- Column</button>
              <label class="toggle-label">
                <input type="checkbox" id="headerRowToggle" checked>
                Header Row
              </label>
            </div>
            <div class="table-container" id="tableContainer">
              <table class="editable-table" id="editableTable">
                <thead>
                  <tr>
                    <th contenteditable="true">Column 1</th>
                    <th contenteditable="true">Column 2</th>
                    <th contenteditable="true">Column 3</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- HTML Editor -->
          <div class="html-editor" id="htmlEditor" style="display: none;">
            <textarea id="htmlContent" class="form-control html-textarea" placeholder="Enter HTML content..."></textarea>
          </div>

          <!-- User Mention Insert -->
          <div class="mention-section">
            <label>Insert User Mention:</label>
            <select id="userMentionSelect" class="form-control form-control-sm">
              <option value="">Select user...</option>
            </select>
            <button class="btn btn-sm" id="insertMentionBtn">Insert</button>
          </div>

          <!-- Version Message -->
          <div class="form-group">
            <label for="versionMessage">Version Message (optional)</label>
            <input type="text" id="versionMessage" class="form-control form-control-sm" placeholder="Describe your changes">
          </div>

          <!-- Save Button -->
          <div class="editor-footer">
            <button class="btn btn-primary btn-lg" id="savePageBtn">Save Page</button>
            <span class="save-hint">Saving will increment the page version</span>
          </div>
        </div>
      </main>
    </div>

    <!-- Create Page Modal -->
    <div class="modal" id="createPageModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Create New Page</h3>
          <button class="modal-close" id="closeCreateModal">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="newPageTitle">Page Title</label>
            <input type="text" id="newPageTitle" class="form-control" placeholder="Enter page title">
          </div>
          <div class="form-group">
            <label for="newPageId">Page ID (optional)</label>
            <input type="text" id="newPageId" class="form-control" placeholder="Leave empty for auto-generated ID">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="cancelCreatePage">Cancel</button>
          <button class="btn btn-primary" id="confirmCreatePage">Create</button>
        </div>
      </div>
    </div>

    <!-- Create User Modal -->
    <div class="modal" id="createUserModal">
      <div class="modal-content modal-sm">
        <div class="modal-header">
          <h3>Add New User</h3>
          <button class="modal-close" id="closeUserModal">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="newUserName">Display Name</label>
            <input type="text" id="newUserName" class="form-control" placeholder="Enter user name">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="cancelCreateUser">Cancel</button>
          <button class="btn btn-primary" id="confirmCreateUser">Add User</button>
        </div>
      </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
